<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Isle · Supabase 连接自检</title>
<style>
  body{font-family:-apple-system,"Segoe UI",sans-serif;background:#f5f7f6;color:#1f2d28;padding:28px;max-width:760px;margin:auto;line-height:1.6}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#66756e;font-size:13px;margin-bottom:20px}
  button{background:#2f6b57;color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .item{background:#fff;border:1px solid #dde5e0;border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .item b{display:block;font-size:14px;margin-bottom:4px}
  .ok{border-left:5px solid #2f9e68}.err{border-left:5px solid #c94f4f}.wait{border-left:5px solid #bbb}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:#4a5a53;margin:6px 0 0}
  code{background:#eef2f0;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
  <h1>Supabase 连接自检</h1>
  <div class="sub">依次检测：登录 → 读 → 写 → 再读。每步结果会明确显示，用于定位数据为什么没上云。</div>
  <button id="run">开始自检</button>
  <div id="out"></div>

<script>
const URL='https://imkzvylogdiaqprnxurx.supabase.co';
const KEY='sb_publishable_3FUG7wjLpqgHROGEiyDngQ_QBgJl9V4';
const EMAIL='mlxx4235@cc.com', PASS='ysyqdzgnr666';
const out=document.getElementById('out');
function add(title,cls,detail){
  const d=document.createElement('div');d.className='item '+cls;
  d.innerHTML='<b>'+title+'</b><pre>'+detail+'</pre>';out.appendChild(d);
}
function baseHeaders(token){const h={'apikey':KEY,'Content-Type':'application/json'};if(token)h['Authorization']='Bearer '+token;return h;}
async function req(path,opt){
  opt=opt||{};
  const h=baseHeaders(opt.token);
  if(opt.prefer)h['Prefer']=opt.prefer;
  const r=await fetch(URL+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  const t=await r.text();let j;try{j=t?JSON.parse(t):null;}catch(e){j=t;}
  if(!r.ok){const e=new Error((j&&(j.msg||j.message||j.error_description))||('HTTP '+r.status));e.status=r.status;throw e;}
  return j;
}
document.getElementById('run').onclick=async()=>{
  document.getElementById('run').disabled=true;out.innerHTML='';
  let token;
  // 1 login
  try{
    const j=await req('/auth/v1/token?grant_type=password',{method:'POST',body:{email:EMAIL,password:PASS}});
    token=j.access_token;
    add('1. 登录 Supabase','ok','成功 · token 长度 '+(token||'').length+' · role='+((j.user&&j.user.role)||'unknown'));
  }catch(e){add('1. 登录 Supabase','err','失败：'+e.message+'（HTTP '+(e.status||'?')+'）');document.getElementById('run').disabled=false;return;}
  // 2 read real row
  try{
    const rows=await req('/rest/v1/app_state?id=eq.1&select=id,payload,updated_at',{token});
    add('2. 读取 app_state 第 1 行','ok',rows&&rows.length?('有数据 · size='+JSON.stringify(rows[0].payload||{}).length+' · updated='+(rows[0].updated_at||'')):'空表（还没有数据）');
  }catch(e){add('2. 读取 app_state 第 1 行','err','失败：'+e.message+'（HTTP '+(e.status||'?')+'）');}
  // 3 write probe row 999
  const probe={ping:new Date().toISOString(),note:'diagnostic'};
  try{
    await req('/rest/v1/app_state',{method:'POST',token,body:[{id:999,payload:probe,updated_at:new Date().toISOString()}],prefer:'resolution=merge-duplicates,return=minimal'});
    add('3. 写入测试行 id=999','ok','写入成功');
  }catch(e){add('3. 写入测试行 id=999','err','失败：'+e.message+'（HTTP '+(e.status||'?')+'）');}
  // 4 read back probe
  try{
    const rows=await req('/rest/v1/app_state?id=eq.999&select=payload',{token});
    add('4. 回读测试行','ok',rows&&rows.length?('成功 · '+JSON.stringify(rows[0].payload)):'读不到（写入没生效）');
  }catch(e){add('4. 回读测试行','err','失败：'+e.message+'（HTTP '+(e.status||'?')+'）');}
  document.getElementById('run').disabled=false;
};
</script>
</body>
</html>
